machine:
  frame_id: robot_map
  # campetella is spawned at world (1.0, 0.0, 0.8) (scanning_entrypoint.sh);
  # that point is campetella_base_link's own origin, NOT the geometric center
  # of the machine (measured from its meshes: 4.2206 x 1.5609 x 1.7137 m,
  # offset (-0.7352, -0.4334, z-range [-0.2662, 1.4475]) from that origin).
  # Using the real geometric center here keeps the scan ring symmetric
  # around the actual machine instead of skewed toward one side of it.
  center: [-2.7352, -3.4334, 1.3906]

scan:
  # The machine is long and narrow (4.22 x 1.56 m), so a tight ring corner-cuts
  # through it between consecutive points. 8 points per ring keeps the path
  # closer to the true circle (and gives Nav2 more intermediate waypoints to
  # curve around the machine, same reasoning as the 2->4 fix earlier).
  points_per_ring: 8
  # UR5e shoulder sits ~0.52 m above ground (wheel_radius 0.11 + chassis_link
  # offset 0.1775 + arm mount 0.235). Heights below that force the wrist to
  # bend down and back to look at the target, clipping the wrist-camera
  # bracket against the forearm. Keeping heights at/above shoulder height
  # keeps the wrist in a much more comfortable, collision-free configuration.
  heights: [0.7, 1.0, 1.3]
  # Machine's long half-axis is 2.11 m (4.2206/2) and the nearest wall (south,
  # y=-7 in robot_map) is 3.57 m from the new center, so base_radius=3.0 clears
  # the machine (+0.9 m margin) while staying 0.57 m short of that wall.
  base_radius: 3.0
  base_height: 0.0
  # Keeps the same ~0.7 m base-to-arm-target standoff that was verified
  # collision-free earlier (base_radius - end_effector_radius = 0.7).
  end_effector_radius: 2.3
  start_angle_deg: 0.0
