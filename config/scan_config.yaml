machine:
  frame_id: robot_map
  # campetella is spawned at world (1.0, 0.0, 0.8) (scanning_entrypoint.sh);
  # that point is campetella_base_link's own origin, NOT the geometric center
  # of the machine (measured from its meshes: 4.2206 x 1.5609 x 1.7137 m,
  # offset (-0.7352, -0.4334, z-range [-0.2662, 1.4475]) from that origin).
  # Using the real geometric center here keeps the scan ring symmetric
  # around the actual machine instead of skewed toward one side of it.
  center: [-2.7352, -3.4334, 1.3906]

# Geometry metadata copied into every generated plan. The plot uses this by
# default, so its invocation does not need to repeat model-path or pose data.
structure:
  model: /fnh_pkgs/src/renee_simulation/campetella_sim/models/campetella_CRC/urdf/campetella.urdf.xacro
  # campetella_base_link in robot_map: world spawn (1.0, 0.0, 0.8) minus
  # world->robot_map (3, 3, 0). This pose is visualization metadata.
  origin_pose: [-2.0, -3.0, 0.8, 0.0]
  xacro_args:
    - robot_scale:=0.001
    - mode:=navigation

scan:
  pattern_type: circular
  # Smoke-test profile: one station on the short side of the structure. Once
  # navigation, Pilz motion and RGB-D capture work together, change this to 8.
  points_per_ring: 1
  start_angle_deg: 90.0
  # One horizontal height band for the first integrated test. Additional bands
  # remain supported by adding values, e.g. [0.7, 0.9, 1.1].
  heights: [0.9]
  # Machine's long half-axis is 2.11 m (4.2206/2) and the nearest wall (south,
  # y=-7 in robot_map) is 3.57 m from the new center, so base_radius=3.0 clears
  # the machine (+0.9 m margin) while staying 0.57 m short of that wall.
  base_radius: 3.0
  base_height: 0.0
  # The arm target is 0.4 m inward from the rover center. At z=0.9 m this is a
  # conservative first pose for the UR5e mounted about 0.544 m above ground.
  end_effector_radius: 2.6
