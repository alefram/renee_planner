# Fixed ring of camera poses around the Campetella for mapping, in simulation:
# one pose every ring.spacing_m along the lap, the camera looking at the
# machine 45 deg down from above. The surface/camera sections only measure
# what the ring sees (coverage in the viewer); candidates and set_cover are
# not used with poses.method: ring.
# Run with:
#   ros2 action send_goal --feedback /generate_scan_poses \
#     renee_trajectory_generation/action/GenerateScanPoses "{experiment: mapping, use_cache: true}"
# =============================================================================
# 1. EXPERIMENT: name, mode and node parameters (sim or real robot)
# =============================================================================
experiment:
  name: mapping
  mode: cad                        # cad | sensor
  description: >-
    Simulation: fixed ring around the Campetella, the camera looking at the machine 45 deg down
    from above, evenly spaced along one forward lap (for mapping).
  node_parameters:
    use_sim_time: true
    tf_timeout_s: 10.0
    description_timeout_s: 15.0

# Frame of the output poses (the executor's Nav2/MoveIt goals).
frame: robot_map

# coverage: the fewest poses covering the surface (candidates + set_cover);
# ring: the fixed ring below, every pose kept (candidates/set_cover not used).
poses:
  method: ring

ring:
  spacing_m: 0.6                   # one pose every 0.6 m of lane
  pitch_deg: 30.0                  # optical axis 45 deg below horizontal, towards the machine
  height_m: 1.1                  # null: machine top + above_top_m, capped at workspace.camera_height_m
  above_top_m: 0.8
  inset_m: 0.4                     # camera from the lane towards the machine (arm reach)
  look_distance_m: 1.5             # look_at along the optical axis

# =============================================================================
# 2. MACHINE: description, enabled parts and pose
# =============================================================================
machine:
  root_link: campetella_base_link
  description_topic: /campetella_robot_description
  urdf_file: ""                    # empty: the description topic; or a .urdf / .xacro path
  config_file: package://campetella_sim/config/campetella_config.yaml
  pose_source: tf                  # tf: robot_map -> campetella_base_link; yaml: the pose below
  pose: {xyz: [-2.0, -3.0, 0.8], rpy_deg: [0.0, 0.0, 0.0]}
  # Mesh paths in the URDF are file://<campetella_sim>/...; map them when the
  # generator runs where that path differs (e.g. [["/fnh_pkgs/src", "/home/me/renee_ws/src"]]).
  mesh_path_map: []

# What to inspect: sections (extraction, transversal, vertical, wrist, cart)
# and/or parts (link names, with or without _link; wildcards: transversal2*).
# A point counts if its section or its part is listed; all empty = the whole
# machine. The parts not listed still block the camera and keep the robot away.
# e.g. sections: [transversal]   parts: [vertical27, wrist*]   exclude_parts: [cart*]
target:
  sections: []
  parts: []
  exclude_parts: []

# =============================================================================
# 3. SURFACE: CAD sampling
# =============================================================================
surface:
  spacing_m: 0.025                 # distance between sample points
  max_triangles: 150000            # merged mesh after decimation (sampling + occlusion)
  web_triangles: 60000             # viewer mesh
  min_normal_z: -0.7               # drop faces looking down more than this (machine bottom)
  min_height_m: null
  enclosed_distance_m: 0.03        # drop contact faces between parts
  seed: 0

# =============================================================================
# 4. CAMERA: ZED2i left optical frame, effective field of view for coverage
# =============================================================================
camera:
  frame: robot_arm_rgbd_camera_left_camera_optical_frame
  fov_deg: [60.0, 40.0]            # ZED2i: 110 x 70; the borders are not used for inspection
  range_m: [0.3, 1.5]
  max_incidence_deg: 60.0

# =============================================================================
# 5. WORKSPACE: where the robot can put the camera (no IK)
# =============================================================================
workspace:
  robot_half_width_m: 0.5         # RB-VOGUI+ base: footprint 1.2 x 0.7 m
  lane_clearance_m: 0.30           # base to machine footprint
  arm_reach_in_m: 0.90             # camera from the lane towards the machine (plan view)
  arm_reach_out_m: 0.30
  camera_height_m: [0.80, 1.40]
  min_clearance_m: 0.15            # camera to any machine collision box
  loop_resolution_m: 0.05

# =============================================================================
# 6. CANDIDATES, VISIBILITY, SELECTION AND ORDER
# =============================================================================
candidates:
  cluster_size_m: 0.25             # surface patch size
  min_cluster_points: 5
  standoffs_m: [0.6, 0.8, 1.0]
  tilts_deg: [0.0, 25.0]
  tilt_azimuths: 4
  max_candidates: 500
  line_of_sight_tolerance_m: 0.03
  seed: 0

visibility:
  occlusion_tolerance_m: 0.02

set_cover:
  target_coverage: 0.95            # of the points some candidate can see
  views_per_point: 1
  min_new_points: 20
  max_poses: 300
  tilt_cost_per_rad: 0.3

ordering:
  direction: ccw                   # driving direction around the machine (seen from above)
  start_xy: null                   # null: start after the widest gap between poses
  window_m: 0.0                    # keep the ring's order (no 2-opt)
  angle_weight_m_per_rad: 0.3
